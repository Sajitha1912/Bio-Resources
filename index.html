<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Dark is the only theme. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0F3D2E" />

    <!-- Primary SEO defaults. Per-page title, description, canonical, Open Graph
         and Twitter tags are overwritten at runtime (see src/lib/seo.ts). These
         defaults cover crawlers that do not execute JavaScript.
         VERIFY: replace https://www.example.com with the production domain —
         it must match company.url in src/data/site.ts. -->
    <title>Bio Resources Pvt Ltd | Life-Science Research Services</title>
    <meta
      name="description"
      content="Life-science research services: cell-based and in vitro studies, computational studies (docking, molecular dynamics, 3D-QSAR, DFT, machine learning, network pharmacology, immunoinformatics and vaccine designing), plus natural-molecule drugs and nanomaterial delivery."
    />
    <meta
      name="keywords"
      content="life-science research services, computational studies, molecular docking, molecular dynamics, 3D-QSAR, DFT, density functional theory, machine learning, network pharmacology, immunoinformatics, vaccine designing, in vitro assays, medicinal plants, phytochemistry, nanotechnology, drug discovery"
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://www.example.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bio Resources Pvt Ltd" />
    <meta property="og:locale" content="en" />
    <meta
      property="og:title"
      content="Bio Resources Pvt Ltd | Life-Science Research Services"
    />
    <meta
      property="og:description"
      content="Life-science research services: cell-based and in vitro studies, computational studies (docking, molecular dynamics, 3D-QSAR, DFT, machine learning, network pharmacology, immunoinformatics and vaccine designing), plus natural-molecule drugs and nanomaterial delivery."
    />
    <meta property="og:url" content="https://www.example.com/" />
    <meta property="og:image" content="https://www.example.com/images/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Bio Resources Pvt Ltd | Life-Science Research Services"
    />
    <meta
      name="twitter:description"
      content="Life-science research services: cell-based and in vitro studies, computational studies (docking, molecular dynamics, 3D-QSAR, DFT, machine learning, network pharmacology, immunoinformatics and vaccine designing), plus natural-molecule drugs and nanomaterial delivery."
    />
    <meta
      name="twitter:image"
      content="https://www.example.com/images/logo.png"
    />

    <!-- Fonts: Fraunces (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
